[package]
name = "grindvakt"
version = "1.2.0"
edition = "2024"
rust-version = "1.99"
description = "Grindvakt — a user-mode DNS updater for DNSimple with secure local vault and systemd user timer"
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/grindvakt"
authors = ["WeirdBrains"]

[package.metadata.grindvakt]
# Internal metadata to help tests/tools know the minimum supported toolchain features.
min_ttl = 60
default_ttl = 300

[package.metadata.deb]
name = "grindvakt"
maintainer = "unspecified"
copyright = "2026, WeirdBrains / Michael Christenson II"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """
Grindvakt is a secure, user-mode DNS updater for DNSimple.
It installs /usr/bin/grindvakt and documentation. Service
management is explicit via systemd --user; no root units
or package hooks are installed.
"""
assets = [
  ["target/release/grindvakt", "usr/bin/grindvakt", "755"],
  ["README.md", "usr/share/doc/grindvakt/README.md", "644"],
  ["docs/IMPLEMENTATION_NOTES.md", "usr/share/doc/grindvakt/IMPLEMENTATION_NOTES.md", "644"],
]

[package.metadata.generate-rpm]
license = "BSD-3-Clause"
assets = [
  { source = "target/release/grindvakt", dest = "/usr/bin/grindvakt", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/grindvakt/README.md", mode = "644" },
  { source = "docs/IMPLEMENTATION_NOTES.md", dest = "/usr/share/doc/grindvakt/IMPLEMENTATION_NOTES.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/grindvakt/LICENSE", mode = "644" },
]

[dependencies]
# The DNS engine, vault format and private-file handling. Always the exact version that matches
# this release (lockstep; see docs/RELEASES.md) and always from crates.io.
grindvakt-core = { version = "=1.2.0", features = ["vault", "standalone"] }
anyhow = "1.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "fs", "process", "signal", "sync", "io-util"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
secrecy = "0.10"
rpassword = "7.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
sha2 = "0.10"
libc = "0.2"


[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Services",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_EventLog",
  "Win32_Storage_FileSystem",
] }
windows-service = "0.7"
widestring = "1.1"

[dev-dependencies]
assert_fs = "1.1"
serde_json = "1.0"
tempfile = "3.10"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "fs"] }
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"

