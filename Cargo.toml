[package]
name = "grindvakt"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
description = "Grindvakt — a user-mode DNS updater for DNSimple with secure local vault and systemd user timer"
license = "UNLICENSED"
repository = ""
authors = ["WeirdBrains"]

[package.metadata.grindvakt]
# Internal metadata to help tests/tools know the minimum supported toolchain features.
min_ttl = 60
default_ttl = 300

[package.metadata.deb]
name = "grindvakt"
maintainer = "unspecified"
copyright = "Copyright: Proprietary"
section = "utils"
priority = "optional"
extended-description = """
Grindvakt is a secure, user-mode DNS updater for DNSimple.
It installs /usr/bin/grindvakt and documentation. Service
management is explicit via systemd --user; no root units
or package hooks are installed.
"""
assets = [
  ["target/release/grindvakt", "usr/bin/grindvakt", "755"],
  ["README.md", "usr/share/doc/grindvakt/README.md", "644"],
  ["docs/IMPLEMENTATION_NOTES.md", "usr/share/doc/grindvakt/IMPLEMENTATION_NOTES.md", "644"],
]

[package.metadata.generate-rpm]
license = "LicenseRef-proprietary"
assets = [
  { source = "target/release/grindvakt", dest = "/usr/bin/grindvakt", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/grindvakt/README.md", mode = "644" },
  { source = "docs/IMPLEMENTATION_NOTES.md", dest = "/usr/share/doc/grindvakt/IMPLEMENTATION_NOTES.md", mode = "644" },
]

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "fs", "process", "signal", "sync"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
secrecy = "0.8"
zeroize = "1.7"
rand = "0.8"
argon2 = "0.5"
hkdf = "0.12"
bip39 = { version = "1.1", default-features = false, features = ["std", "rand"] }
base64 = "0.21"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dnsimple = "8.0.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
humantime = "2.1"
tempfile = "3.10"
sha2 = "0.10"
blake3 = "1.5"
regex = "1.10"
uuid = { version = "1.10", features = ["v4"] }
chacha20poly1305 = "0.10"
rpassword = "7.3"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
assert_fs = "1.1"
predicates = "3.0"
serial_test = "3.1"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "fs"] }
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"

